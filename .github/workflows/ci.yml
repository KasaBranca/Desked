name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check server.js
          node --check cli.js
          node --check lib/auth.js
          node --check lib/config.js
          node --check lib/env-store.js
          node --check lib/h264-annexb.js
          node --check lib/hw-h264-encoder.js
          node --check lib/input-handler.js
          node --check lib/password.js
          node --check lib/screen-capture.js
          node --check lib/tunnel-url.js
          node --check scripts/tunnel.js
          node --check public/js/app.js

      - name: Unit tests
        run: npm test

      - name: Dependency audit (informational)
        run: npm audit --audit-level=high
        continue-on-error: true
