name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No npm install needed: the unit tests only use Node built-ins.
      - name: Syntax check
        run: |
          node --check server.js
          node --check cli.js
          node --check lib/auth.js
          node --check lib/config.js
          node --check lib/env-store.js
          node --check lib/h264-annexb.js
          node --check lib/hw-h264-encoder.js
          node --check lib/input-handler.js
          node --check lib/password.js
          node --check lib/screen-capture.js
          node --check public/js/app.js

      - name: Unit tests
        run: node --test
